
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          result=$?
          set -o pipefail
          if [ "$result" -ne 0 ] && [ "$result" -ne 141 ]; then
            echo "SDK license acceptance returned $result"
          fi

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Configure Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_PATH"

      - name: Install Rust and Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust core for Android
        working-directory: rust-core
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 build --release

      - name: Copy Rust shared libraries
        run: |
          set -eux
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          mkdir -p app/src/main/jniLibs/x86_64

          cp rust-core/target/aarch64-linux-android/release/libswipesort_core.so app/src/main/jniLibs/arm64-v8a/
          cp rust-core/target/armv7-linux-androideabi/release/libswipesort_core.so app/src/main/jniLibs/armeabi-v7a/
          cp rust-core/target/x86_64-linux-android/release/libswipesort_core.so app/src/main/jniLibs/x86_64/

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwipeSort-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
